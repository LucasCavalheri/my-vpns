name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install system deps for packaging
        run: sudo apt-get update && sudo apt-get install -y rpm dpkg-dev apt-utils gnupg

      - name: Install npm deps
        run: npm ci

      - name: Test
        run: npm test

      - name: Build .deb + .rpm
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp release/*.deb release/*.rpm dist-release/
          ls -lh dist-release

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          NOTES=$(cat <<'EOF'
          ## Packages

          - `.deb` — Debian / Ubuntu / Mint
          - `.rpm` — Fedora / RHEL / Rocky / Alma / openSUSE

          ### Install / upgrade (Debian & Ubuntu)

          After installing once, updates come with `sudo apt upgrade`:

          ```bash
          sudo apt install ./my-vpns_*_amd64.deb
          # postinst installs the archive key and APT source automatically
          sudo apt update && sudo apt upgrade
          ```

          Or add the repo manually:

          ```bash
          curl -fsSL https://lucascavalheri.github.io/my-vpns/apt/my-vpns-archive-keyring.asc \
            | sudo tee /usr/share/keyrings/my-vpns-archive-keyring.asc >/dev/null
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/my-vpns-archive-keyring.asc] https://lucascavalheri.github.io/my-vpns/apt ./' \
            | sudo tee /etc/apt/sources.list.d/my-vpns.list
          sudo apt update && sudo apt install my-vpns
          ```

          ### Fedora / RPM

          ```bash
          sudo dnf install ./my-vpns-*.x86_64.rpm
          ```
          EOF
          )
          # strip common leading indent from the heredoc body
          NOTES="$(printf '%s\n' "$NOTES" | sed 's/^          //')"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist-release/* \
              --title "My VPNs ${TAG}" \
              --notes "$NOTES"
          fi

      - name: Publish APT repo to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DEBS=(dist-release/*.deb)
          if [ "${#DEBS[@]}" -ne 1 ]; then
            echo "expected exactly one .deb, found ${#DEBS[@]}" >&2
            exit 1
          fi
          DEB="${DEBS[0]}"

          if [ -z "${APT_SIGNING_KEY:-}" ]; then
            echo "GitHub secret APT_SIGNING_KEY is required to publish the signed APT repo" >&2
            exit 1
          fi
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill all 2>/dev/null || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          APT_SIGNING_KEY_ID="$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          EXPECTED_KEY_ID="$(gpg --batch --show-keys --with-colons \
            packaging/my-vpns-archive-keyring.asc \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [ -z "$APT_SIGNING_KEY_ID" ] || [ "$APT_SIGNING_KEY_ID" != "$EXPECTED_KEY_ID" ]; then
            echo "APT_SIGNING_KEY does not match the committed public archive key" >&2
            exit 1
          fi
          export APT_SIGNING_KEY_ID

          WORK="$(mktemp -d)"
          if git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "$WORK"; then
            true
          else
            rm -rf "$WORK"
            mkdir -p "$WORK"
            git -C "$WORK" init
            git -C "$WORK" checkout -b gh-pages
            git -C "$WORK" remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          fi

          mkdir -p "$WORK/apt"
          bash packaging/build-apt-repo.sh "$WORK/apt" "$DEB"

          cat > "$WORK/index.html" << 'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>My VPNs</title>
          <p><a href="https://github.com/LucasCavalheri/my-vpns">My VPNs</a> APT repo lives under <a href="./apt/">/apt/</a>.</p>
          EOF

          git -C "$WORK" config user.name "github-actions[bot]"
          git -C "$WORK" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$WORK" add -A
          if git -C "$WORK" diff --cached --quiet; then
            echo "APT repo unchanged"
          else
            git -C "$WORK" commit -m "apt: publish ${{ github.ref_name }}"
            git -C "$WORK" push -u origin gh-pages
          fi
