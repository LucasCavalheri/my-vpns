name: Platform checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare real Windows client for localhost tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-test.ps1
      - run: npm test
      - run: npm run lint
      - run: npm run build:bundle
      - name: Check macOS helper syntax
        if: runner.os == 'macOS'
        run: bash -n packaging/macos-vpn.sh
